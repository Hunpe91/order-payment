<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="Images/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css"/>
    <title>Order Payment Page</title>
</head>
<body>
    <div class="container">
        <div class="cad">
            <img src="./images/hherro.jpg" alt="dancing hero" class="hero">
          <div class="content">
             <h1> Order Summary</h1>
            <p class="description"> You can listen to millions of songs, <br>
                audiobooks and podcaston any device <br> anywhere you like</p>
                <div class="Sub">
                    <img src="./images/icon-music.jpg" alt="music icon" class="music-icon">
                    <div class="plan-details">
                    <div class="plan-type"> Annual Plan </div>
                    <div class="price"> $55.99/year </div>  
                    </div>
                    <a href="#payment-options" class="change-link"> change</a>
                </div>
                    <div id="payment-options" class="payment-options">
                        <div class="payment-method">
                            <img src="./images/icon-music.jpg" alt="paypal">
                            <span>Credit Card</span>
                        </div> 
                        <div class="payment-method">
                            <img src="./images/icon-music.jpg" alt="credit card">
                            <span>Paypal</span>
                        </div>
                    </div>
                    <button class="proceed"> Proceed to Payment</button>
                    <a href="#cancel-payment" class="cancel-link"> cancel payment </a>
          </div>  
        </div>
    </div>
</body>
</html>
